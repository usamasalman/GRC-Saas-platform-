# GRC Wisdom — single-host production stack.
#
# Four containers behind one origin: Caddy terminates TLS and serves both the
# SPA and /api from the same address, which is why there is no CORS
# configuration to get wrong.
#
#   docker compose up -d
#   docker compose exec api npm run provision   # first time only
#
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grcwisdom
      POSTGRES_USER: grcwisdom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports: mapping. Postgres is reachable only from the compose network,
    # never from the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grcwisdom -d grcwisdom"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: ghcr.io/${GH_OWNER}/grcwisdom-api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://grcwisdom:${POSTGRES_PASSWORD}@db:5432/grcwisdom
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      NODE_ENV: production
      PORT: 3000
      # Same-origin deployment, so this is only used if you later split the UI
      # onto its own hostname.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Used once by `npm run provision` to create the first administrator.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      # Uploaded evidence and documents. Without this they are written to the
      # container filesystem and vanish on the next deploy. Library documents
      # uploaded before they moved to the store below are still read from here.
      - uploads:/app/uploads
      # Delivery evidence, branding logos and, since they moved here, library
      # documents. A separate volume from uploads because it is a separate
      # store with different rules: nothing here is ever served statically,
      # and every read goes through an authenticated handler. Back up both.
      - evidence:/app/evidence-store
    networks:
      default:
        aliases:
          # Caddy addresses this name, not the bare service name `api`.
          #
          # This host runs several stacks and more than one of them has a
          # service called `api`. Caddy was attached to two networks, so Docker
          # resolved `api` to the OTHER application's container — which does not
          # listen on 3000, producing `connection refused` from a container that
          # was healthy the whole time. A project-prefixed alias cannot collide.
          - grcwisdom-api-svc
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    image: ghcr.io/${GH_OWNER}/grcwisdom-web:${TAG:-latest}
    restart: unless-stopped
    networks:
      default:
        aliases:
          - grcwisdom-web-svc

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Must NOT default to a bare IP. Compose always passes this variable, so a
      # default here overrides the Caddyfile's own `{$SITE_ADDRESS:...}` fallback
      # — setting the fallback alone has no effect.
      #
      # `http://:80` means: listen on port 80 on every interface, match any Host.
      # That serves the IP today and a domain later without a Caddyfile change.
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The other projects' site blocks (see the end of the Caddyfile). The
      # folder is the server's: the deploy creates it if missing and never
      # writes into it, so a GRC Wisdom deploy cannot remove their routes.
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      # This stack's own network, where Caddy reaches grcwisdom-api-svc and
      # grcwisdom-web-svc.
      - default
      # The network Caddy shares with the other projects it serves. It used to
      # be attached to their networks by hand, and every deploy that recreated
      # this container dropped those attachments and took their sites offline.
      # A named, external network survives both sides: no project's deploy or
      # `compose down` removes it, and each project joins it in its own compose
      # file (deploy/SHARED-PROXY.md). Caddy addresses this stack's services by
      # their grcwisdom-* aliases, so a service called `api` or `web` in
      # another project on this network cannot be mistaken for ours.
      - caddy-edge
    depends_on:
      - api
      - web

networks:
  # Created by the deploy if it does not exist (docker network create
  # caddy-edge), and shared with the other projects on this server.
  caddy-edge:
    external: true
    name: caddy-edge

volumes:
  pgdata:
  uploads:
  evidence:
  caddy_data:
  caddy_config:

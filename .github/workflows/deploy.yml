name: Deploy

# Push to main → typecheck and build → images to GHCR → server pulls and restarts.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A second push while the first is still deploying cancels the first, so the
  # server never receives two overlapping `compose up` runs.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: postgres
          POSTGRES_DB: grcwisdom_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/grcwisdom_test
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Caddyfile is shipped to the server and bind-mounted. A syntax error
      # in it does not fail a build — it fails at reload, or worse, silently at
      # the next container restart, hours later. Parse it here, where it costs
      # five seconds and blocks the deploy.
      - name: Caddyfile — validate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SITE_ADDRESS="http://:80" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Frontend — install and typecheck
        run: |
          npm ci
          npm run build

      - name: API — install, migrate, build
        working-directory: grc_wisdom_api
        run: |
          npm ci
          npx prisma migrate deploy
          npm run build

      # Pure logic — schedule arithmetic and the tenant access boundary. No
      # database, no server, so it runs before either exists and fails fast.
      - name: API — pure logic suite
        working-directory: grc_wisdom_api
        run: node scripts/verify/project-logic-test.js

      # Renders real reports and reads them back. A renderer that accepts a
      # brand colour and never draws it, or a footer loop that runs once on a
      # five-page document, both produce a perfectly valid file — so parsing the
      # output is the only way to see either. No database needed.
      - name: API — report chrome renders and parses
        working-directory: grc_wisdom_api
        run: node scripts/verify/report-chrome-test.js

      # The five delivery reports, rendered and read back. A committee paper
      # that prints the flattering figure without the other, or a percentage
      # with no statement of the standard it was measured to, produces a
      # perfectly valid PDF — so parsing the output is the only way to see it.
      - name: API — delivery reports say what they should
        working-directory: grc_wisdom_api
        run: node scripts/verify/delivery-report-test.js

      # Everything that can be decided by reading the source. None of these
      # needs a database or a running server, so they run before either exists
      # and cost seconds. Each one exists because the defect it describes
      # reached a deploy once already.
      - name: API — source invariants
        working-directory: grc_wisdom_api
        run: |
          node scripts/verify/uploads-not-public-test.js
          node scripts/verify/document-preview-markup-test.js
          node scripts/verify/no-native-dialogs-test.js
          node scripts/verify/routes-reachable-test.js
          node scripts/verify/record-deletion-test.js
          node scripts/verify/nav-capabilities-test.js
          node scripts/verify/capabilities-mean-something-test.js
          node scripts/verify/guarded-actions-test.js
          node scripts/verify/portal-follows-role-test.js
          node scripts/verify/platform-scope-test.js
          node scripts/verify/standards-enablement-test.js
          node scripts/verify/enablement-plan-test.js
          node scripts/verify/tenant-provisioning-test.js
          node scripts/verify/tenant-suspension-test.js
          node scripts/verify/persisted-state-test.js
          node scripts/verify/estate-posture-test.js
          node scripts/verify/project-membership-test.js
          node scripts/verify/plan-builder-test.js
          node scripts/verify/project-standards-test.js
          node scripts/verify/project-activation-test.js
          node scripts/verify/report-honesty-test.js
          node scripts/verify/provider-engagement-test.js
          node scripts/verify/work-notification-test.js
          node scripts/verify/document-publication-test.js
          node scripts/verify/document-links-test.js
          node scripts/verify/document-access-test.js
          node scripts/verify/retention-test.js
          node scripts/verify/legal-hold-test.js
          node scripts/verify/offboarding-test.js
          node scripts/verify/invoicing-test.js
          node scripts/verify/workflow-authoring-test.js
          node scripts/verify/vendor-import-test.js
          node scripts/verify/no-mock-engine-test.js
          node scripts/verify/document-editors-test.js
          node scripts/verify/no-invented-data-test.js
          node scripts/verify/audit-chain-test.js
          node scripts/verify/deploy-safety-test.js
          node scripts/verify/background-jobs-test.js
          node scripts/verify/audit-trail-access-test.js
          node scripts/verify/reported-defects-test.js
          node scripts/verify/session-per-tab-test.js
          # QA: whole-platform checks. Each open defect they find is listed in
          # scripts/verify/qa/known-defects.js; a new one, or a known one that
          # starts passing, fails the build. See docs/qa/test-plan.md.
          node scripts/verify/qa-write-guards-test.js
          node scripts/verify/qa-api-contract-test.js
          node scripts/verify/qa-menu-test.js
          node scripts/verify/qa-headers-test.js
          node scripts/verify/qa-claims-test.js
          node scripts/verify/qa-capacity-test.js
          node scripts/verify/login-entrance-test.js
          node scripts/verify/grc-summary-test.js

      # Demo tenant data, THEN reference data. That order is load-bearing:
      # seed:demo rebuilds the user table, so a bootstrap admin created before
      # it is wiped and every suite that signs in as the admin then fails with
      # "Invalid credentials". Provision is idempotent, so it goes last.
      - name: API — seed demo data, then provision reference data
        working-directory: grc_wisdom_api
        env:
          BOOTSTRAP_ADMIN_EMAIL: ci@example.com
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-password-not-a-secret
        run: |
          npm run seed:demo
          npm run provision

      # The HTTP suites. Until now none of these had ever executed — every
      # claim they make rested on reading code — and running them found a real
      # defect (unapproved risk-appetite drafts were being served as the
      # binding ceiling) plus the setup problems this job now works around.
      #
      # Each suite mutates the demo data and says so in its own output, so the
      # data is rebuilt between them. That costs seconds and removes the
      # class of failure where suite N passes alone and fails after suite N-1.
      - name: API — HTTP suites against a real database
        working-directory: grc_wisdom_api
        env:
          API: http://127.0.0.1:3000
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-only-password-not-a-secret
          BOOTSTRAP_ADMIN_EMAIL: ci@example.com
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-password-not-a-secret
        run: |
          # NODE_ENV is set on the SERVER PROCESS, not on the step.
          #
          # The suites need the API running as production, but the reseed in
          # the loop below is a separate process, and seed.ts refuses to run
          # when NODE_ENV says production — deliberately, because a container
          # command that seeded on every restart once wiped a live database
          # for twenty-five days. As a step-level variable it reached the
          # reseed too, and the first iteration failed the whole job.
          #
          # Keeping the variable on the server alone is the fix that does not
          # require telling the guard to stand down.
          NODE_ENV=production node dist/server.js &
          echo $! > /tmp/http.pid

          for i in $(seq 1 30); do
            curl -sf -m 5 http://127.0.0.1:3000/health > /dev/null && break
            sleep 1
          done
          curl -sf -m 5 http://127.0.0.1:3000/health > /dev/null || { echo "API never came up"; exit 1; }

          for suite in             asset-import-test             asset-lifecycle-test             audit-tabs-test             criteria-versioning-test             document-import-test             document-upload-test             import-export-test             report-formats-test             residual-feedback-test             risk-import-test             risk-lifecycle-loops             journey-document-lifecycle-test             journey-impersonation-test             journey-billing-test             journey-iso-controls-test             qa-role-crawl-test             qa-isolation-test             qa-input-robustness-test             audit-concurrency-test             package-limits-test             platform-library-test             engagement-s1-lifecycle-test             engagement-s2-gantt-test             engagement-s3-templates-test             engagement-s4-relationship-test             engagement-s5-access-test             engagement-s6-scope-test             engagement-s7-after-close-test             engagement-s8-requests-test             document-next-version-test             engagement-s9-threads-test             engagement-s10-assessment-test             engagement-s11-challenges-test engagement-s12-readiness-test engagement-s13-certification-test
          do
            echo "── $suite ──"
            npm run seed:demo > /dev/null
            npm run provision > /dev/null
            node "scripts/verify/$suite.js"
          done

          PID=$(cat /tmp/http.pid)
          kill "$PID" || true
          wait "$PID" 2>/dev/null || true
          rm -f /tmp/http.pid

      # Deliberately on its OWN server process. It makes failed logins to prove
      # the auth limiter works, and that limiter is in-memory per process with
      # a 15-minute window — so anything sharing a server with it afterwards
      # fails on "Too many attempts" rather than on its own merits. A fresh
      # process is what keeps the steps independent; do not merge this into the
      # step above to save a boot.
      - name: API — boot and run the production-readiness suite
        working-directory: grc_wisdom_api
        env:
          NODE_ENV: production
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-only-password-not-a-secret
        run: |
          node dist/server.js &
          echo $! > /tmp/server.pid

          for i in $(seq 1 30); do
            curl -sf -m 5 http://127.0.0.1:3000/health > /dev/null && break
            sleep 1
          done
          curl -sf -m 5 http://127.0.0.1:3000/health > /dev/null || { echo "API never came up"; exit 1; }

          # Asserts every security property that was actually broken: the
          # removed user-directory endpoint, the self-closing bootstrap, a
          # login that works, an admin that holds capabilities, CORS refusing
          # strangers, and login rate limiting.
          node scripts/verify/production-readiness-test.js

          PID=$(cat /tmp/server.pid)
          kill "$PID" || true
          wait "$PID" 2>/dev/null || true
          rm -f /tmp/server.pid

      - name: API — delivery projects suite
        working-directory: grc_wisdom_api
        env:
          NODE_ENV: production
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-only-password-not-a-secret
        run: |
          node dist/server.js &
          echo $! > /tmp/server.pid

          for i in $(seq 1 30); do
            curl -sf -m 5 http://127.0.0.1:3000/health > /dev/null && break
            sleep 1
          done
          curl -sf -m 5 http://127.0.0.1:3000/health > /dev/null || { echo "API never came up"; exit 1; }

          # Slices 1-8 of the delivery module: creation, derived schedule,
          # lifecycle transitions, tenant isolation, the audit trail, the
          # phase/task rollup, and separation of duties on verification —
          # that last one is the control the dual progress figure rests on,
          # and it is asserted over HTTP against a real database because a
          # pure test cannot prove two different sessions are two people.
          # Slice 4 adds the baseline and the delay register: a date cannot
          # move past the agreed one, and work cannot be blocked, without
          # saying why and which side owes the days.
          # Slice 5 adds evidence and traceability. The assertions that matter
          # most are the two immutability rules — nothing may be attached
          # behind a completed sign-off, and evidence a reviewer relied on
          # cannot be withdrawn — plus the fact that an evidence file is
          # unreachable without an Authorization header.
          node scripts/verify/project-delivery-test.js

          PID=$(cat /tmp/server.pid)
          kill "$PID" || true
          wait "$PID" 2>/dev/null || true
          rm -f /tmp/server.pid

      # The screens themselves, in Chromium, Firefox and WebKit (Safari's
      # engine, and every browser on an iPhone), at desktop and phone size.
      # The HTTP suites prove each screen's data loads; these prove the screen
      # survives it. Known defects come from the same register as every other
      # QA suite, so this step fails on a NEW one, or on a fixed one still
      # listed. Its own server process, reseeded: the steps above changed data.
      - name: Web — browser tests on three engines
        env:
          E2E_API_URL: http://127.0.0.1:3000
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-only-password-not-a-secret
          BOOTSTRAP_ADMIN_EMAIL: ci@example.com
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-password-not-a-secret
        run: |
          npx playwright install --with-deps chromium firefox webkit

          cd grc_wisdom_api
          npm run seed:demo > /dev/null
          npm run provision > /dev/null
          # The web app is served by vite preview on 4173 and calls this API
          # from there, so that origin is the one CORS must allow.
          NODE_ENV=production CORS_ORIGINS=http://localhost:4173,http://127.0.0.1:4173 node dist/server.js &
          echo $! > /tmp/e2e.pid
          for i in $(seq 1 30); do
            curl -sf -m 5 http://127.0.0.1:3000/health > /dev/null && break
            sleep 1
          done
          curl -sf -m 5 http://127.0.0.1:3000/health > /dev/null || { echo "API never came up"; exit 1; }
          cd ..

          npx playwright test

          PID=$(cat /tmp/e2e.pid)
          kill "$PID" || true
          wait "$PID" 2>/dev/null || true
          rm -f /tmp/e2e.pid

  build:
    name: Build and push images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./grc_wisdom_api
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/grcwisdom-api:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/grcwisdom-api:${{ github.sha }}

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/grcwisdom-web:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/grcwisdom-web:${{ github.sha }}

  deploy:
    name: Deploy to Contabo
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The stack config used to live only on the server, so a change to
      # docker-compose.yml or the Caddyfile in this repo never reached it —
      # the deploy pulled new images into an old topology and the two silently
      # drifted apart. .env is deliberately NOT copied: it holds the secrets and
      # the host-specific ports, and belongs only to the machine.
      #
      # It lands in ~/grcwisdom/.incoming, not over the live files: Caddy is the
      # entrance for every project on the server (deploy/SHARED-PROXY.md), so
      # nothing it reads is replaced until it has been checked, below.
      - name: Ship the stack config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "~/grcwisdom/.incoming"
          strip_components: 1
          overwrite: true

      - name: Pull the new images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd ~/grcwisdom

            # Back up the database before anything changes. The API applies its
            # migrations when it starts, so this is the last moment the data is
            # in the shape the running version left it. A backup that fails, or
            # that cannot be read back, stops the deploy with the site untouched.
            # Kept on the server in ~/grcwisdom/backups, newest 10.
            if [ -n "$(docker compose ps -q db 2>/dev/null)" ]; then
              mkdir -p backups
              BACKUP="backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ)-${{ github.sha }}.dump"
              docker compose exec -T db pg_dump -U grcwisdom -d grcwisdom -Fc > "$BACKUP"
              TABLES=$(docker compose exec -T db pg_restore --list < "$BACKUP" | grep -c ' TABLE ' || true)
              if [ "$TABLES" -lt 1 ]; then
                echo "The backup $BACKUP lists no tables; not deploying over a database that is not backed up."
                exit 1
              fi
              echo "Backed up the database to ~/grcwisdom/$BACKUP ($(du -h "$BACKUP" | cut -f1), $TABLES tables)."
              ls -1t backups/pre-deploy-*.dump | tail -n +11 | xargs -r rm -f
            else
              echo "No database container running yet; nothing to back up."
            fi

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Set dynamic variables from current GitHub repo/owner
            export GH_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export TAG=${{ github.sha }}

            # ── Caddy is shared: a deploy may change GRC Wisdom, never the others ──
            #
            # This Caddy is the entrance for every project on the server
            # (deploy/SHARED-PROXY.md). Deploys used to take the other projects'
            # sites down (QA-037): they pulled the floating caddy:2-alpine tag and
            # recreated the container whenever a new Caddy came out, which drops
            # every site and any network attached to it by hand; they copied the
            # Caddyfile over the live one before checking it; and a reload that
            # failed fell back to restarting Caddy.
            #
            # Now Caddy (and Postgres) are only started if they are not running —
            # never pulled, recreated or restarted by a deploy — and the
            # Caddyfile is swapped only when it changed, cannot drop a site that
            # is served now, and the running Caddy has validated it. Anything
            # else stops the deploy with every site still up.

            # The host names in a Caddy JSON config, one per line. Both sides of
            # the comparison below come from Caddy itself, so this never has to
            # understand Caddyfile syntax.
            site_hosts() {
              { grep -o '"host":\[[^]]*\]' || true; } \
                | sed 's/^"host":\[//; s/\]$//' | tr ',' '\n' | tr -d '"' | sort -u
            }

            # Refuses (exit 1) a new Caddyfile that the running Caddy does not
            # accept, or that would stop serving a site it serves now. Changes
            # nothing either way. Run inside the running container, so the new
            # file is read exactly as a reload would read it: with this
            # server's SITE_ADDRESS and the site files Caddy can see.
            check_caddyfile() {
              docker compose exec -T caddy sh -c 'cat > /etc/caddy/Caddyfile.next' < .incoming/Caddyfile
              if ! docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile.next --adapter caddyfile; then
                echo "::error::The new Caddyfile did not validate. Caddy has NOT been changed"
                echo "and every site is still up. The error is in deploy/Caddyfile or in a"
                echo "file in ~/grcwisdom/sites (the message above names it)."
                exit 1
              fi
              if ! docker compose exec -T caddy wget -qO- http://127.0.0.1:2019/config/ > .incoming/running.json; then
                echo "::error::Could not read the configuration Caddy is running, so the new"
                echo "Caddyfile cannot be checked against it. Caddy has NOT been changed."
                exit 1
              fi
              site_hosts < .incoming/running.json > .incoming/hosts.now
              docker compose exec -T caddy caddy adapt --config /etc/caddy/Caddyfile.next --adapter caddyfile \
                | site_hosts > .incoming/hosts.next
              local dropped
              dropped=$(comm -23 .incoming/hosts.now .incoming/hosts.next | tr '\n' ' ')
              if [ -n "$dropped" ]; then
                echo "::error::The new Caddyfile would stop serving: $dropped"
                echo "Caddy has NOT been changed and every site is still up. Caddy serves"
                echo "these now, but neither deploy/Caddyfile nor ~/grcwisdom/sites/*.caddy"
                echo "has them. Move each one into a file in ~/grcwisdom/sites/"
                echo "(deploy/SHARED-PROXY.md, step 4), then re-run this deploy."
                exit 1
              fi
            }

            # Everything is checked before anything changes.
            if ! docker compose --project-directory . -f .incoming/docker-compose.yml config -q; then
              echo "::error::The new docker-compose.yml does not load with this server's .env. Nothing was changed."
              exit 1
            fi
            if [ -n "$(docker compose ps -q caddy 2>/dev/null)" ] && [ -f Caddyfile ] \
               && ! cmp -s .incoming/Caddyfile Caddyfile; then
              check_caddyfile
            fi

            # Pull with a real backoff, one service at a time.
            #
            # The previous form was `pull || (sleep 3 && pull) || (sleep 5 && pull)`,
            # and it failed a deploy on a reset that three seconds could never
            # have healed. The observed failure is ghcr.io over IPv6 resetting
            # mid-layer:
            #
            #   read tcp [2a02:c207:...]:35804->[2606:50c0:8002::154]:443:
            #   read: connection reset by peer
            #
            # 2606:50c0::/32 is GitHub, so the host is reaching the registry over
            # IPv6 and losing the connection partway through a ~100MB layer.
            # Docker's own per-layer retry cannot help once the pull as a whole
            # aborts.
            #
            # Retrying IS worth doing here, because completed layers stay in the
            # local cache: each attempt resumes from further along rather than
            # starting over. That only works with enough time between attempts
            # for the path to recover, hence the backoff.
            #
            # Per-service so that a failure on the API image does not discard a
            # finished pull of web.
            pull_with_backoff() {
              local svc="$1" delay=5 attempt
              for attempt in 1 2 3 4 5; do
                if docker compose pull "$svc"; then
                  return 0
                fi
                echo "pull of $svc failed (attempt $attempt/5); waiting ${delay}s"
                sleep "$delay"
                delay=$(( delay * 2 ))
              done
              echo "::error::Could not pull $svc after 5 attempts."
              echo "If the log shows 'connection reset by peer' against a 2606:50c0::/32"
              echo "address, the host reached ghcr.io over IPv6 and the connection died"
              echo "mid-layer. Force IPv4 for GitHub's range only, which makes the daemon"
              echo "fall back without touching the rest of the host's IPv6:"
              echo "  sudo ip -6 route add blackhole 2606:50c0::/32"
              echo "(/etc/gai.conf does not help here — dockerd is Go and does not read it.)"
              return 1
            }

            # Only this application's images. caddy:2-alpine and
            # postgres:16-alpine are floating tags, and pulling them is what
            # turned an ordinary deploy into a Caddy or Postgres upgrade — and a
            # recreated container — whenever a new release happened to be out.
            # Those are upgraded on purpose (deploy/SHARED-PROXY.md), not here.
            for svc in api web; do
              pull_with_backoff "$svc"
            done

            # The checked config goes live. Copying the compose file changes
            # nothing that is running; a missing Caddyfile means a first deploy,
            # with no Caddy yet and nothing to protect.
            cp .incoming/docker-compose.yml docker-compose.yml
            [ -f Caddyfile ] || cp .incoming/Caddyfile Caddyfile

            # This used to run `systemctl stop/disable apache2 nginx` to clear
            # port 80. That is destructive on a shared host: this VPS runs a
            # second application, and if that one is served by host nginx then
            # every deploy here took it offline — with `disable` making it stay
            # offline across a reboot.
            #
            # The right fix for a port clash is to publish on a free port
            # (HTTP_PORT / HTTPS_PORT in .env), not to evict the neighbour.
            # Fail loudly instead, so a clash is visible rather than resolved by
            # breaking something else.
            # This Caddy also serves other projects on the server (see
            # deploy/SHARED-PROXY.md). Their routes live in ~/grcwisdom/sites,
            # which this job never writes into, and Caddy reaches their
            # containers over the shared caddy-edge network. Both are created
            # here if missing and otherwise left exactly as they are.
            docker network inspect caddy-edge >/dev/null 2>&1 || docker network create caddy-edge
            mkdir -p ~/grcwisdom/sites

            # Postgres and Caddy are started if they are not running and left
            # alone if they are: --no-recreate keeps the running container even
            # when its image or its definition in docker-compose.yml changed.
            # Then only api and web are replaced, and --no-deps keeps compose
            # from touching anything else on the way.
            if ! docker compose up -d --no-recreate db caddy; then
              echo "compose up failed. If this is a port clash, set HTTP_PORT and"
              echo "HTTPS_PORT in ~/grcwisdom/.env to free ports. Currently bound:"
              sudo ss -tlnp | grep -E ':(80|443)\s' || true
              exit 1
            fi
            docker compose up -d --no-deps --remove-orphans api web

            # A change to the db or caddy service in docker-compose.yml is
            # therefore not applied by a deploy. Say so, rather than let the
            # repository and the server drift apart unnoticed.
            for svc in db caddy; do
              want=$(docker compose config --hash "$svc" 2>/dev/null | awk '{print $2}' || true)
              have=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.config-hash" }}' "$(docker compose ps -q "$svc")" 2>/dev/null || true)
              if [ -n "$want" ] && [ -n "$have" ] && [ "$want" != "$have" ]; then
                echo "::warning::The $svc service in docker-compose.yml changed and is NOT applied: deploys never recreate $svc. Apply it on purpose, at a quiet moment (deploy/SHARED-PROXY.md, Upgrading Caddy or Postgres)."
              fi
            done

            # Wait for API container to initialize before provisioning reference data
            echo "Waiting for API container to initialize..."
            for i in $(seq 1 30); do
              if docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "API is up"
                break
              fi
              sleep 2
            done

            # Reference data converges on every deploy. This only upserts
            # capabilities and system roles — it never touches tenant data.
            docker compose exec -T api npm run provision

            # The Caddyfile is bind-mounted, and changing a mounted file does not
            # reload Caddy. So when — and only when — the new one differs from
            # the live one, it is checked again against what Caddy serves at this
            # moment, written over the live file in place (the container sees
            # the same file, and a restart later loads the same config), and
            # loaded with a graceful reload: in-flight requests finish and no
            # site drops.
            #
            # The reload loads the very file check_caddyfile validated. If it is
            # refused anyway, the live file is put back and the deploy fails.
            # Caddy is never restarted here: a refused reload leaves the old
            # configuration running, which keeps every site up, while a restart
            # takes every site down — including the other projects'.
            if cmp -s .incoming/Caddyfile Caddyfile; then
              echo "Caddyfile unchanged: Caddy left exactly as it is."
            else
              check_caddyfile
              cp Caddyfile Caddyfile.prev
              cat .incoming/Caddyfile > Caddyfile
              if docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile.next --adapter caddyfile; then
                echo "Caddy reloaded gracefully with the new Caddyfile; every site kept serving."
              else
                cat Caddyfile.prev > Caddyfile
                echo "::error::Caddy refused the reload. The previous Caddyfile is back in place"
                echo "and Caddy is still running it, so every site is up; the GRC Wisdom"
                echo "routing change is NOT applied. The message above says why."
                exit 1
              fi
            fi

            docker image prune -f

      - name: Confirm the deployment is answering
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            cd ~/grcwisdom

            # This used to probe 127.0.0.1:3000 from INSIDE the api container,
            # which proves only that the API process started. Caddy could be
            # crash-looping, the web container missing and port 80 unpublished,
            # and this step still went green while the site was unreachable.
            #
            # Probe the published port instead — the same path a browser takes.
            # `|| true` matters here. Under `set -euo pipefail`, a grep that finds
            # nothing exits 1, pipefail propagates it, and set -e kills the script
            # at this line — before a single diagnostic is printed. HTTP_PORT is
            # optional, so "not found" is a normal outcome, not a failure.
            PORT="$(grep -E '^HTTP_PORT=' .env 2>/dev/null | cut -d= -f2 || true)"
            PORT="${PORT:-80}"
            BASE="http://127.0.0.1:${PORT}"

            # -m 5 is not optional. Caddy's lb_try_duration holds a request for
            # 10s while it retries an unavailable upstream, and curl has no
            # default timeout — so 30 unbounded attempts take 300s and hit the
            # step's 5m ceiling before a single diagnostic prints.
            #
            # Budget: 20 x (5s probe + 3s sleep) = 160s worst case, leaving the
            # rest of the window for the failure report below.
            echo "Probing ${BASE} through Caddy..."
            for i in $(seq 1 20); do
              CODE="$(curl -s -m 5 -o /dev/null -w '%{http_code}' "${BASE}/health" || echo 000)"
              if [ "$CODE" = "200" ]; then
                echo "edge is answering /health after ${i} attempt(s)"
                break
              fi
              echo "  attempt ${i}: HTTP ${CODE}"
              sleep 3
            done

            curl -sf -m 5 -o /dev/null "${BASE}/health" || {
              echo "FAILED: the edge never answered ${BASE}/health"
              echo
              # Every diagnostic gets `|| true` so one failing command cannot
              # abort the report and leave the next person guessing.
              echo "--- container status ---"
              docker compose ps || true
              echo
              echo "--- is the API alive inside its own container? ---"
              docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/health').then(r=>console.log('api self:',r.status)).catch(e=>console.log('api self FAILED:',e.message))" || true
              echo
              echo "--- can Caddy reach the API over the docker network? ---"
              docker compose exec -T caddy wget -qO- --timeout=3 http://grcwisdom-api-svc:3000/health >/dev/null 2>&1 \
                && echo "caddy -> api OK" || echo "caddy -> api FAILED"
              echo
              echo "--- what is published on the host? ---"
              (sudo ss -tlnp | grep -E ":(${PORT}|80|443)\s") || echo "nothing listening on ${PORT}/80/443"
              echo
              echo "--- caddy ---"; docker compose logs --tail=40 caddy || true
              echo "--- api ---";   docker compose logs --tail=60 api   || true
              echo "--- db ---";    docker compose logs --tail=20 db    || true
              exit 1
            }

            # /health proxies to the API. The SPA is a different container, so
            # check the app root separately or a missing web image goes unnoticed.
            if ! curl -sf -m 5 -o /dev/null "${BASE}/"; then
              echo "FAILED: the API answers but the app itself does not."
              docker compose logs --tail=40 web
              exit 1
            fi

            echo "deployment healthy — edge, API and SPA all responding"

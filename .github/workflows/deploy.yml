name: Deploy

# Push to main → typecheck and build → images to GHCR → server pulls and restarts.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A second push while the first is still deploying cancels the first, so the
  # server never receives two overlapping `compose up` runs.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: postgres
          POSTGRES_DB: grcwisdom_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/grcwisdom_test
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Caddyfile is shipped to the server and bind-mounted. A syntax error
      # in it does not fail a build — it fails at reload, or worse, silently at
      # the next container restart, hours later. Parse it here, where it costs
      # five seconds and blocks the deploy.
      - name: Caddyfile — validate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SITE_ADDRESS="http://:80" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Frontend — install and typecheck
        run: |
          npm ci
          npm run build

      - name: API — install, migrate, build
        working-directory: grc_wisdom_api
        run: |
          npm ci
          npx prisma migrate deploy
          npm run build

      - name: API — provision reference data against a real database
        working-directory: grc_wisdom_api
        env:
          BOOTSTRAP_ADMIN_EMAIL: ci@example.com
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-password-not-a-secret
        run: |
          npm run provision

      - name: API — boot and run the production-readiness suite
        working-directory: grc_wisdom_api
        env:
          NODE_ENV: production
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-only-password-not-a-secret
        run: |
          node dist/server.js &
          echo $! > /tmp/server.pid

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health > /dev/null || { echo "API never came up"; exit 1; }

          # Asserts every security property that was actually broken: the
          # removed user-directory endpoint, the self-closing bootstrap, a
          # login that works, an admin that holds capabilities, CORS refusing
          # strangers, and login rate limiting.
          node scripts/verify/production-readiness-test.js

          kill "$(cat /tmp/server.pid)" || true

  build:
    name: Build and push images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./grc_wisdom_api
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/grcwisdom-api:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/grcwisdom-api:${{ github.sha }}

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/grcwisdom-web:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/grcwisdom-web:${{ github.sha }}

  deploy:
    name: Deploy to Contabo
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The stack config used to live only on the server, so a change to
      # docker-compose.yml or the Caddyfile in this repo never reached it —
      # the deploy pulled new images into an old topology and the two silently
      # drifted apart. .env is deliberately NOT copied: it holds the secrets and
      # the host-specific ports, and belongs only to the machine.
      - name: Ship the stack config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "~/grcwisdom"
          strip_components: 1
          overwrite: true

      - name: Pull the new images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ~/grcwisdom

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Set dynamic variables from current GitHub repo/owner
            export GH_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export TAG=${{ github.sha }}

            # Pull images with retry in case of network glitch
            docker compose pull || (sleep 3 && docker compose pull) || (sleep 5 && docker compose pull)

            # This used to run `systemctl stop/disable apache2 nginx` to clear
            # port 80. That is destructive on a shared host: this VPS runs a
            # second application, and if that one is served by host nginx then
            # every deploy here took it offline — with `disable` making it stay
            # offline across a reboot.
            #
            # The right fix for a port clash is to publish on a free port
            # (HTTP_PORT / HTTPS_PORT in .env), not to evict the neighbour.
            # Fail loudly instead, so a clash is visible rather than resolved by
            # breaking something else.
            if ! docker compose up -d --remove-orphans; then
              echo "compose up failed. If this is a port clash, set HTTP_PORT and"
              echo "HTTPS_PORT in ~/grcwisdom/.env to free ports. Currently bound:"
              sudo ss -tlnp | grep -E ':(80|443)\s' || true
              exit 1
            fi

            # Wait for API container to initialize before provisioning reference data
            echo "Waiting for API container to initialize..."
            for i in $(seq 1 30); do
              if docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "API is up"
                break
              fi
              sleep 2
            done

            # Reference data converges on every deploy. This only upserts
            # capabilities and system roles — it never touches tenant data.
            docker compose exec -T api npm run provision

            # The Caddyfile is bind-mounted, and this job now copies a fresh one
            # up on every deploy. Changing a mounted file does not restart the
            # container and does not reload the config, so without this the
            # server keeps running whatever it parsed the last time it started.
            #
            # Validate first: an invalid Caddyfile that gets reloaded is rejected
            # and the old config stays live, but validating separately turns a
            # syntax error into a clear message here rather than a puzzling
            # "reload failed" further down.
            echo "Reloading Caddy configuration..."
            if docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile; then
              # A reload is graceful — in-flight requests finish, no dropped
              # connections, and it re-resolves the upstream addresses.
              docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
              echo "Caddy reloaded"
            else
              echo "FAILED: the Caddyfile did not validate. Caddy is still running"
              echo "the previous configuration. Fix deploy/Caddyfile and push again."
              exit 1
            fi

            docker image prune -f

      - name: Confirm the deployment is answering
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd ~/grcwisdom

            # This used to probe 127.0.0.1:3000 from INSIDE the api container,
            # which proves only that the API process started. Caddy could be
            # crash-looping, the web container missing and port 80 unpublished,
            # and this step still went green while the site was unreachable.
            #
            # Probe the published port instead — the same path a browser takes.
            # `|| true` matters here. Under `set -euo pipefail`, a grep that finds
            # nothing exits 1, pipefail propagates it, and set -e kills the script
            # at this line — before a single diagnostic is printed. HTTP_PORT is
            # optional, so "not found" is a normal outcome, not a failure.
            PORT="$(grep -E '^HTTP_PORT=' .env 2>/dev/null | cut -d= -f2 || true)"
            PORT="${PORT:-80}"
            BASE="http://127.0.0.1:${PORT}"

            echo "Probing ${BASE} through Caddy..."
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null "${BASE}/health"; then
                echo "edge is answering /health"
                break
              fi
              sleep 2
            done

            curl -sf -o /dev/null "${BASE}/health" || {
              echo "FAILED: the edge never answered ${BASE}/health"
              echo
              # Every diagnostic gets `|| true` so one failing command cannot
              # abort the report and leave the next person guessing.
              echo "--- container status ---"
              docker compose ps || true
              echo
              echo "--- is the API alive inside its own container? ---"
              docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/health').then(r=>console.log('api self:',r.status)).catch(e=>console.log('api self FAILED:',e.message))" || true
              echo
              echo "--- can Caddy reach the API over the docker network? ---"
              docker compose exec -T caddy wget -qO- --timeout=3 http://api:3000/health >/dev/null 2>&1 \
                && echo "caddy -> api OK" || echo "caddy -> api FAILED"
              echo
              echo "--- what is published on the host? ---"
              (sudo ss -tlnp | grep -E ":(${PORT}|80|443)\s") || echo "nothing listening on ${PORT}/80/443"
              echo
              echo "--- caddy ---"; docker compose logs --tail=40 caddy || true
              echo "--- api ---";   docker compose logs --tail=60 api   || true
              echo "--- db ---";    docker compose logs --tail=20 db    || true
              exit 1
            }

            # /health proxies to the API. The SPA is a different container, so
            # check the app root separately or a missing web image goes unnoticed.
            if ! curl -sf -o /dev/null "${BASE}/"; then
              echo "FAILED: the API answers but the app itself does not."
              docker compose logs --tail=40 web
              exit 1
            fi

            echo "deployment healthy — edge, API and SPA all responding"
